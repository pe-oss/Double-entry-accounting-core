# ============================================================
# Double-Entry Accounting Core - PostgreSQL 16
# Chạy (từ thư mục gốc dự án):
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
# Dừng:
#   docker compose -f docker/docker-compose.yml --env-file .env down
# Lược đồ CSDL được quản lý bằng Alembic (thư mục migrations/), không đặt ở đây.
# ============================================================
name: accounting-core

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting_core_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounting_core}
      POSTGRES_USER: ${POSTGRES_USER:-acc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acc_secure_password_2026}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: accounting_core_pgdata
